[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armforge"
version = "0.1.0"
description = "Arm-aware inference configuration engine: predict the best LLM runtime configuration from Arm CPU capabilities, then prove it by measurement."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["arm", "aarch64", "graviton", "llm", "inference", "benchmark", "optimization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
armforge = "armforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/armforge"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer's whole API is call-in-default; B008 does not apply to it.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so `tests.helpers` resolves. Without this,
# bare `pytest` fails while `python -m pytest` works, because only the latter
# adds the working directory -- a difference that hid this until CI ran.
pythonpath = ["."]
